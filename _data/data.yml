experiences:
  title: Experiences
  info:
    - role: Linux Admin
      time: 2023 - Present
      company: Wipro
      details: |
        - **Responsibilities** <br>
        - System Monitoring and Maintenance:
          - Regularly monitor system performance and ensure the stability and reliability of applications.
          - Perform routine maintenance tasks such as updates, patches, and backups.
        - Application Deployment and Configuration:
          - Deploy new applications and updates, ensuring they are configured correctly and optimized for performance.
          - Manage and configure servers to support application requirements.
        - Troubleshooting and Issue Resolution:
          - Identify and resolve system and application issues promptly to minimize downtime.
          - Collaborate with development and support teams to address and fix bugs.
        - Security Management:
          - Implement and maintain security measures to protect systems and data.
          - Regularly update security protocols and monitor for potential threats.
        - Automation and Scripting:
          - Develop and maintain scripts to automate routine tasks and improve efficiency.
          - Use tools like Ansible, Puppet, or Chef for configuration management and automation.
        - Documentation and Reporting:
          - Document system configurations, procedures, and changes for future reference.
          - Generate reports on system performance, incidents, and resolutions.
        - Collaboration and Communication:
          - Work closely with cross-functional teams to support application development and deployment.
          - Provide feedback and insights during project planning and execution.
        - Capacity Planning and Optimization:
          - Monitor resource usage and plan for future capacity needs.
          - Optimize system performance to handle increasing loads and demands.
        - Backup and Recovery:
          - Ensure regular backups are performed and verify their integrity.

        **Jr. DevOps eng.**
        - **Responsibilities**
          - **🔧 System Configuration & Management**
            - Configured and managed client Ubuntu machines using SaltStack and Foreman.
            - Provisioned and administered client machines remotely via Foreman, ensuring consistent infrastructure deployment.
            - Maintained and updated SaltStack states, including managing containerized environments using Podman. 
          - **🛠️ Infrastructure & Automation**
            - Oversaw backend infrastructure services and systems, including patching and updates for core services such as Foreman, Grafana, Prometheus, and SaltStack
            - Automated routine system administration tasks using Bash scripting, enhancing operational efficiency.
            
          - **🖥️ Remote User Support**:
            - Provided technical support to end-users by troubleshooting and resolving issues related to proxies, VPNs, Kerberos authentication, and software installation
            - Remotely accessed user machines via SSH to diagnose and resolve incidents logged via ServiceNow (SNOW).
            - Ensured prompt response and resolution of ServiceNow incidents and service requests.
          - **💾 Version Control & Documentation**:
            - Managed Git repositories using Git and GitHub; created and updated documentation hosted via GitHub Pages.
            - Collaborated with team members to maintain and standardize scripts and configuration files in version-controlled environments.

          - **🔄Patch Management**:
            - Executed remote patching of client machines using SaltStack.
            - Performed manual patching and maintenance of core backend servers and containerized services.
          - **🔐 Access & Security**:
            - Managed and audited user access to critical servers and internal tools, ensuring compliance with organizational access policies.
        
          - **📋 Project & Task Management**:
            - Actively contributed to project tracking and sprint management using Jira.
            - Participated in daily scrum calls with clients and stakeholders to review progress and blockers.
            - Took ownership of assigned Jira tasks, including debugging, scripting enhancements, and new feature development.
          - **📅 Daily Operations**:
            - Responded to and resolved ServiceNow tickets.
            - Engaged in sprint planning and retrospective sessions with clients
            - Coordinated with end-users for issue reproduction and resolution.


certifications:
  title: Certifications
  list:
    - name: AZ-900
      start: 2023
      end: 2030
      organization: Microsoft
      details: |
        Covered the fundamentals of Azure and how Geography, Region, and Data Centre are interlinked and how cloud works.<br>
        Public, Private and Hybrid Cloud <br>
        Services: IAAS, PAAS, SAAS what, how and why. etc.<br>
    - name: AWS Cloud Practitioner
      start: 2025
      end: 2028
      details: |
        Cloud Concepts: Basic understanding of AWS Cloud infrastructure, benefits, and deployment models.
        Core Services: Overview of key AWS services in compute, storage, databases, and networking.
        Security and Compliance: AWS shared responsibility model, IAM, and security services.
        Billing and Pricing: AWS pricing models, Free Tier, and cost management.
        Support and Documentation: AWS support plans, documentation, and tools like Trusted Advisor.
        Architecting on AWS: Basic architectural principles and best practices.
        Deployment and Operations: Introduction to AWS management tools and application deployment basics.
        Technology: Basics of virtualization, containers, serverless computing, and networking concepts.
    - name: RHCSA (Redhat Certified System Administrator)
      start: 2025
      end: 2028
      details: |
       Certified Red Hat System Administrator (RHCSA) with hands-on expertise in RHEL-based systems.
       Proficient in user and group management, file permissions, and system security hardening.
       Experienced in configuring and managing LVM, partitions, and Linux file systems (ext4, xfs).
       Skilled in service and process management using systemctl, along with system performance monitoring.
       Capable of automating tasks with shell scripting and scheduling using cron and at.


